[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "api-contract-regression-tester"
version = "0.1.0"
description = "Automated OpenAPI Contract & Regression Testing Engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "API Testing Team", email = "qa@example.com" }
]
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "jsonschema>=4.20.0",
    "jinja2>=3.1.3",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
api-tester = "api_tester.cli.commands:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=api_tester --cov-report=term-missing"

[tool.coverage.run]
source = ["src/api_tester"]
omit = ["tests/*"]
